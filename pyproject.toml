[project]
name = "pac-man"
version = "0.1.0"
description = "42 school pacman game"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlx",
    "mazegenerator",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
mazegenerator = { path = "mazegenerator-2.1.0-py3-none-any.whl" }
mlx = { path = "mlx-2.2-py3-none-any.whl" }

[dependency-groups]
dev = ["flake8>=7.0", "mypy>=1.10", "pyinstaller>=6.0"]